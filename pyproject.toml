[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rundale-bench"
version = "3.1.0"
description = "Reproducible native-cloud dialogue evaluations for Rundale"
requires-python = ">=3.11"

[project.scripts]
rundale-bench = "rundale_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
